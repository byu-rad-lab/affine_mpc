name: Build and publish to PyPI

on:
  release:
    types: [published]
  # Build and test the wheels and sdist on PRs into main without publishing, so
  # packaging problems show up before a release is published. The changes job
  # skips the builds when a PR changes nothing that goes into them.
  pull_request:
    branches: [main]
    paths:
      - CMakeLists.txt
      - cmake/**
      - include/**
      - src/**
      - python/**
      - pyproject.toml
      - README.md
      - LICENSE
      - licenses/**
      - CITATION.cff
      - .github/workflows/publish_pypi.yaml
  # Build everything by hand, e.g. after changing this workflow's build steps
  # (a PR that only changes this file does not build)
  workflow_dispatch:

# A new push to a PR cancels its unfinished wheel builds; releases always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ## Manually specify versions if one ever fails
  # CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
  CIBW_SKIP: "cp3??t-* *-win32 *-manylinux_i686 *-musllinux_i686"
  CIBW_ARCHS_WINDOWS: AMD64
  CIBW_TEST_REQUIRES: pytest
  # AFFINE_MPC_EXPECT_DAQP makes the binding tests fail if a wheel lacks DAQP
  CIBW_ENVIRONMENT: AFFINE_MPC_HAS_ZLIB=1 AFFINE_MPC_EXPECT_DAQP=1
  CIBW_TEST_COMMAND: "python -m pytest {project}/test/bindings"
  CIBW_BEFORE_ALL_LINUX: >-
    bash -c 'if command -v dnf >/dev/null 2>&1; then dnf install -y zlib-devel;
    elif command -v yum >/dev/null 2>&1; then yum install -y zlib-devel;
    elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y zlib1g-dev;
    elif command -v apk >/dev/null 2>&1; then apk add --no-cache zlib-dev;
    else echo "No supported package manager found for installing zlib" >&2; exit 1; fi'
  CIBW_BEFORE_BUILD_WINDOWS: "pip install delvewheel"
  CIBW_ENVIRONMENT_WINDOWS: >-
    AFFINE_MPC_HAS_ZLIB=1 AFFINE_MPC_EXPECT_DAQP=1 CMAKE_ARGS='-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static'
  CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"

jobs:
  # The release's version (the tag vX.Y.Z, or a PR title "Release X.Y.Z") must
  # match CMakeLists.txt and CITATION.cff, which are bumped by hand; the Python
  # version comes from the tag. Other PRs only check that the two files agree.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check the versions
        env:
          # passed through the environment, not expanded into the script
          TAG: ${{ github.event.release.tag_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          cmake_version=$(sed -nE 's/^ *VERSION ([0-9]+\.[0-9]+\.[0-9]+) *$/\1/p' CMakeLists.txt | head -n 1)
          citation_version=$(sed -nE 's/^version: *"?([^" ]+)"? *$/\1/p' CITATION.cff)
          echo "CMakeLists.txt: ${cmake_version:-none}, CITATION.cff: ${citation_version:-none}"
          if [ -z "$cmake_version" ] || [ "$cmake_version" != "$citation_version" ]; then
            echo "::error::CMakeLists.txt and CITATION.cff must have the same version"
            exit 1
          fi
          if [ -n "$TAG" ]; then
            expected=${TAG#v}
          elif [[ "$PR_TITLE" =~ ^Release\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            expected=${BASH_REMATCH[1]}
          else
            echo "Not a release (the title is not 'Release X.Y.Z')"
            exit 0
          fi
          if [ "$cmake_version" != "$expected" ]; then
            echo "::error::The release is $expected, but CMakeLists.txt and CITATION.cff say $cmake_version"
            exit 1
          fi
          echo "Release $expected matches"

  # Whether to build the wheels and sdist: always for a release or a manual
  # run. A PR builds only if it changes what goes into them, and a push to a PR
  # that changes none of that does not build again if the build of the previous
  # push passed. When in doubt (a cancelled or failed previous build, or a
  # force push), it builds.
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # what goes into the wheels or sdist
          build_paths='^(CMakeLists\.txt|cmake/|include/|src/|python/|pyproject\.toml|README\.md|LICENSE$|licenses/)'
          # true if the changes in the range $1 touch build_paths, or cannot be
          # listed (e.g. a commit lost to a force push)
          changes_build() {
            local files
            files=$(git diff --name-only "$1") || return 0
            grep -qE "$build_paths" <<< "$files"
          }
          build=true
          if [ "$EVENT" = pull_request ]; then
            if ! changes_build "$BASE...$HEAD"; then
              echo "The PR changes nothing that goes into the wheels or sdist"
              build=false
            elif [ "$ACTION" = synchronize ] && [ -n "$BEFORE" ] && ! changes_build "$BEFORE..$HEAD"; then
              previous=$(gh run list --workflow publish_pypi.yaml --commit "$BEFORE" \
                --json conclusion --jq '.[0].conclusion // ""')
              echo "The last push changed nothing that goes into the wheels or sdist; the build of $BEFORE: ${previous:-none}"
              if [ "$previous" = success ]; then
                build=false
              fi
            fi
          fi
          echo "build=$build"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build-wheels:
    needs: [check-version, changes]
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        ## Manually specify versions if one ever fails
        # os: [ubuntu-24.04, windows-2025, macos-15]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # setuptools_scm needs the tags for the version (PR checkouts are
          # shallow merge commits without them)
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Windows step
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install zlib:x64-windows-static eigen3:x64-windows-static

      # macOS step
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake zlib eigen

      - name: Install cibuildwheel
        run: pip install cibuildwheel

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse

      - name: List built wheels (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path wheelhouse) {
              ls wheelhouse
          } else {
              Write-Host "wheelhouse folder does not exist yet."
          }

      - name: List built wheels (Linux/macOS)
        if: runner.os != 'Windows'
        run: ls -l wheelhouse

      - name: Upload built wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    needs: [check-version, changes]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz

  publish-pypi:
    # PR runs only build and test; only a published release uploads to PyPI
    if: github.event_name == 'release'
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - name: List downloaded distributions
        run: ls -l dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
