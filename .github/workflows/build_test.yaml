name: Build and Test

on:
  pull_request:
    paths:
      - CMakeLists.txt
      - cmake/**
      - include/**
      - src/**
      - test/**
      - python/CMakeLists.txt
      - python/affine_mpc/**
      - python/bindings/**
      - requirements/build.txt
      - .github/workflows/build_test.yaml
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - cmake/**
      - include/**
      - src/**
      - test/**
      - python/CMakeLists.txt
      - python/affine_mpc/**
      - python/bindings/**
      - requirements/build.txt
      - .github/workflows/build_test.yaml

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libeigen3-dev zlib1g-dev

      - name: Install Python build dependencies
        run: python -m pip install -r requirements/build.txt

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DAFFINE_MPC_BUILD_EXAMPLES=ON \
            -DAFFINE_MPC_BUILD_TESTS=ON \
            -DAFFINE_MPC_BUILD_BINDINGS=ON \
            -DAFFINE_MPC_WARNINGS_AS_ERRORS=ON

      - name: Build project
        run: cmake --build build --config Release --parallel

      - name: Run examples
        run: ./build/example_sim

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # Debug build with AddressSanitizer and UndefinedBehaviorSanitizer. The Python
  # bindings are skipped: an instrumented extension needs the sanitizer runtime
  # preloaded into the Python interpreter.
  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libeigen3-dev zlib1g-dev

      - name: Install Python test dependencies
        run: python -m pip install numpy pytest

      - name: Configure CMake
        run: |
          SAN="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAFFINE_MPC_BUILD_EXAMPLES=ON \
            -DAFFINE_MPC_BUILD_TESTS=ON \
            -DAFFINE_MPC_BUILD_BINDINGS=OFF \
            -DAFFINE_MPC_WARNINGS_AS_ERRORS=ON \
            "-DCMAKE_C_FLAGS=$SAN" \
            "-DCMAKE_CXX_FLAGS=$SAN" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined" \
            "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build project
        run: cmake --build build --parallel

      - name: Run examples
        run: ./build/example_sim

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # C++ library, examples, and tests on macOS and Windows (the Python bindings
  # are covered on these platforms by the wheel builds).
  build-test-other-os:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python test dependencies
        run: python -m pip install numpy pytest

      - name: Configure CMake
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DAFFINE_MPC_BUILD_EXAMPLES=ON
          -DAFFINE_MPC_BUILD_TESTS=ON
          -DAFFINE_MPC_BUILD_BINDINGS=OFF
          -DAFFINE_MPC_WARNINGS_AS_ERRORS=ON

      - name: Build project
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
