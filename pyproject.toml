[build-system]
requires = [
    # 0.11 for the PEP 639 license fields
    "scikit-build-core>=0.11",
    # python/CMakeLists.txt requires pybind11 3
    "pybind11>=3",
]
build-backend = "scikit_build_core.build"

[project]
name = "affine_mpc"
# version = "0.0.0"
dynamic = ["version"]
dependencies = [
    "numpy",
]
authors = [
    {name="Mathew Haskell"},
    {name="Marc Killpack"},
]
maintainers = [
    {name="Mathew Haskell", email="mhaskell9@gmail.com"},
]
description="Affine model predictive control with C++ and Python interfaces"
readme="README.md"
license = "BSD-3-Clause"
# The wheels contain compiled third-party code (OSQP, DAQP, Eigen, pybind11, and
# zlib on Windows) and the wheel repair tools copy in C++ runtime libraries
# (GCC's on musllinux, MSVC's on Windows), whose licenses require their notices
# to ship with it; see licenses/README.md
license-files = ["LICENSE", "licenses/*"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
keywords = [
    "affine mpc",
    "mpc",
    "model predictive control",
    "control",
    "robotics",
    "optimization",
    "quadratic programming",
    "b-spline",
]

[project.urls]
Documentation = "https://byu-rad-lab.github.io/affine_mpc"
Repository = "https://github.com/byu-rad-lab/affine_mpc"
Issues = "https://github.com/byu-rad-lab/affine_mpc/issues"

[project.optional-dependencies]
# Install these with `pip install ".[dev]"`
dev = [
    "pybind11-stubgen>=3,<4",
    "black",
    "pytest",
    "scipy",
]
# Install these with `pip install ".[sparse]"`: QuadraticProgram.P and .A
# (MPC.getQP(), MPC.assembleQP()) convert to scipy.sparse matrices
sparse = [
    "scipy",
]
# Install these with `pip install ".[examples]"`
examples = [
    "matplotlib",
    "abracatabra[qt-pyside6]",
    "tqdm",
]

[project.scripts]
affine-mpc-example-msd = "affine_mpc._examples.sim:main"
affine-mpc-example-quadrotor = "affine_mpc._examples.quadrotor_model_updates:main"

# see https://scikit-build-core.readthedocs.io/en/latest/#configuration for 
# configuration options
[tool.scikit-build]
cmake.build-type = "Release"
install.components = ["python_bindings"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
minimum-version = "build-system.requires"
# sdist.include = ["python/affine_mpc/_version.py"]

[tool.scikit-build.cmake.define]
AFFINE_MPC_BUILD_BINDINGS = "ON"
# DAQP (MIT) is compiled into the wheels, so Python users can pass DAQPSettings
# to MPC.initializeSolver()
AFFINE_MPC_WITH_DAQP = "ON"
# BUILD_SHARED_LIBS = "OFF"

[tool.setuptools_scm]
# Uses info from git tags to generate version numbers.
# Current commit must be tagged with no working changes to get a clean version;
# otherwise, a local version identifier is added.
version_file = "python/affine_mpc/_version.py"

[tool.black]
# black's default, made explicit
line-length = 88
